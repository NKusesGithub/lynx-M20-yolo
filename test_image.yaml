# Settings for yolo26_live.py. Relative paths are relative to this file.

# Reconfigured for Robot Dog.
source: box_distance_approximation/test1.png
rtsp_transport: tcp        # tcp survives radio packet loss better than udp
open_timeout_ms: 5000      # how long to wait before retrying a dead stream

# Frames per second sent to YOLO (the camera itself sends 30).
# Lower = less GPU load, but the tracker matches objects between frames by
# box overlap, so if an object moves more than about half its own width
# between two inference frames it gets a new track ID.
# To find the minimum: lower this (or press - in the window) until the
# "new IDs in last 60s" counter starts climbing, then go back up a step.
inference_fps: 2

models:
  segment: weights/best.pt     # detection + instance masks + tracking
  semantic: weights/yolo26n-sem.pt    # scene classes; null to turn off
  depth: weights/yolo26n-depth.pt     # monocular range; null to turn off (not used by yolo26_live_depthseg.py)

imgsz: 640            # inference size for the segment model; raise for small/distant objects
conf: 0.25            # minimum detection confidence
classes: null         # COCO class ids to keep, e.g. [0, 2] = person, car; null = all
tracker: bytetrack.yaml
device: 0             # 0 = first GPU, or cpu

# Multiplies the depth model's output. The model gives rough meters; to
# calibrate, put an object at a measured distance and set
# depth_scale = measured / shown.
depth_scale: 1.0

display_width: 1600   # total window width in pixels (2x2 grid)

# Box distance from geometry (yolo26_live_depthseg.py only; see BOX_DISTANCE.md).
box_distance:
  enabled: true
  box_class_names: ["box", "cardboard box"]   # class names that count as a box
  box_height_m: 0.35          # real box height, measured
  camera_height_m: 0.45       # PLACEHOLDER: measure lens centre to floor
  camera_pitch_deg: 10.0      # PLACEHOLDER: downward tilt, measure or estimate
  smooth_n: 10                # median over the last N estimates per track
  disagree_ratio: 0.20        # mark "?" if height and floor estimates differ by more
  min_pixel_height: 15        # skip boxes shorter than this on screen
  # Front camera (SM_USB_107X_0.json). For the rear camera use SM_USB_107X_2.json.
  calib_size: [1280, 720]     # resolution K was calibrated at; K is scaled for other sizes
  camera_matrix: [619.97674, 0.0, 586.32027, 0.0, 625.27679, 339.90312, 0.0, 0.0, 1.0]
  dist_coeffs: [-0.291149, 0.057760, -0.006811, 0.001601, 0.0]
